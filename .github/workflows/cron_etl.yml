name: ETL Diario Artistas y Conciertos

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC (~20:00 hs Argentina)
  workflow_dispatch: # ejecución manual desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ETL
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          SETLIST_KEY: ${{ secrets.SETLIST_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python etl.py
